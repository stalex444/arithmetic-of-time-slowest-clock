  - id: "https://github.com/leanprover-community/mathlib4 (Matrix.charpoly, Polynomial.aeval, minpoly, Polynomial.aroots, Polynomial.natDegree, IsIntegral, Polynomial.mahlerMeasure, Nat.iterate)"
    relationship: "builds-on"
    note: >-
      The compared statements use Mathlib and core Lean vocabulary plus
      four short definitions in Challenge.lean (s, mir, inc, sub), each a
      one-line list or matrix construction stated in full there and
      repeated verbatim in Solution.lean. The pinned source of the
