status:
  scope: >-
    Formalized: five compared theorems, in comparator order, namespace
    ArithmeticOfTime. Notation: s is the Padovan rule 0 ↦ [1], 1 ↦ [2],
    2 ↦ [0, 1] on Fin 3; mir σ x = (σ x).reverse; inc σ i j = count of i
    in σ j, as an integer matrix; sub σ w = (w.map σ).flatten; "u is a
    factor of w" is u <:+: w (List.IsInfix). (1) padovan_minimal_unique:
    for k ≤ 3, σ : Fin k → List (Fin k), real θ with
    aeval θ (inc σ).charpoly = 0, 1 < θ, every z in
    (minpoly ℚ θ).aroots ℂ other than θ of norm < 1, and real ρ with
    ρ³ = ρ + 1: ρ ≤ θ, and θ = ρ iff there is e : Fin k ≃ Fin 3 with
    (σ x).map e = s (e x) for all x, or (σ x).map e = mir s (e x) for
    all x. (2) padovan_eigenvalue_unique: the same equivalence for k ≤ 3
    and any real θ with aeval θ (inc σ).charpoly = 0 and ρ³ = ρ + 1, with
    no Pisot hypothesis and no 1 < θ. (3) padovan_matrix_unique: a matrix
    M : Matrix (Fin 3) (Fin 3) ℕ whose integer cast has characteristic
    polynomial X³ − X − 1 satisfies M i j = !![0,0,1; 1,0,1; 0,1,0]
    (e i) (e j) for some e : Fin 3 ≃ Fin 3. (4) pisot_ge_plastic: a real
    θ with 1 < θ, IsIntegral ℤ θ, (minpoly ℚ θ).natDegree ≤ 3 and every
    other root in (minpoly ℚ θ).aroots ℂ of norm < 1 satisfies ρ ≤ θ for
    any real ρ with ρ³ = ρ + 1. (5) padovan_rules_chiral: [2, 0] is a
    factor of (sub s)^[5] [0] and, for all n and x, [0, 2] is not a
    factor of (sub s)^[n] [x]; [0, 2] is a factor of (sub (mir s))^[5] [0]
    and, for all n and x, [2, 0] is not a factor of (sub (mir s))^[n] [x].
    Proved in the repository, not compared: padovan_pisot_eigenvalue
    (Supplement.lean: for ρ³ = ρ + 1, ρ is a root of
    (inc s).charpoly, 1 < ρ, and every root of minpoly ℚ ρ other than ρ
    has norm < 1, so the bound of (1) is attained); and the definition
    audit (DefinitionAudit.lean, imports Mathlib only). Not formalized:
    Siegel's theorem in degree above 3; the case of substitutions on
    four or more letters; any subshift-, tiling-space- or
    reversor-level statement. No compared statement is a physical claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output is exactly
  # [propext, Classical.choice, Quot.sound] (BUILD.txt).

