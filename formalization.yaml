# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# A new entry, the companion of the registered entry PALOMAR-2026-08-19-000006
# (stalex444/arithmetic-of-time); not a revision of it.
version: "v0.4"

project:
  name: "The Arithmetic of Time: the slowest settling clock on at most three letters is the Padovan substitution, unique up to mirror image, and both minimal rules are chiral"
  description: >-
    Five compared theorems. Among all substitutions on at most three
    letters whose incidence matrix has a Pisot eigenvalue θ > 1, the
    least such θ is the plastic number ρ, the real root of x³ = x + 1,
    attained only by the Padovan rule a ↦ b, b ↦ c, c ↦ ab and its
    mirror c ↦ ba, up to renaming the letters; both minimal rules are
    chiral, in opposite directions. Precisely: (1) for a substitution
    σ on k ≤ 3 letters (images may be empty) and a real eigenvalue
    θ > 1 of its integer incidence matrix that is a Pisot number,
    ρ ≤ θ, and θ = ρ exactly when, after renaming the letters, σ is the
    Padovan rule or its mirror; no primitivity or unit hypothesis;
    (2) the same classification for every real eigenvalue, with no
    Pisot hypothesis; (3) a 3 × 3 natural matrix with characteristic
    polynomial x³ − x − 1 is the Padovan matrix after one simultaneous
    permutation of rows and columns; (4) Siegel's bound ρ ≤ θ for
    Pisot numbers of degree at most three (Siegel 1944, restricted;
    not new; proved through the minimal Mahler measures of registered
    entry PALOMAR-2026-08-31-000004); (5) under the Padovan rule the
    word ca is a factor of the fifth iterate from the seed a, and ac is
    a factor of no iterate from any seed; under its mirror, the
    reverse. The uniqueness was stated without proof by Mercat (2020)
    for substitutions on three letters; the contribution is a
    kernel-checked proof of the combined statement, for every real
    eigenvalue and with no primitivity, unit or non-erasing hypothesis
    (in the equality case these are consequences: θ = ρ forces k = 3
    and characteristic polynomial x³ − x − 1), together with the
    chirality of both minimal rules. No first-formalization claim is
    made. That ρ itself is a Pisot eigenvalue of the Padovan matrix,
    so that the bound is attained, is proved in Supplement.lean and
    not compared. Companion of registered entry
    PALOMAR-2026-08-19-000006.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # math.CO / 68R15 and math.DS / 37B10: substitutions, their factor
  # languages and incidence matrices (statements 1, 2, 3, 5). math.NT /
  # 11R06: Pisot numbers (statements 1 and 4). physics.hist-ph / 00A79
  # because the narrative states the physical application: the Scope
  # section of the README, shared verbatim with the companion entry,
  # identifies physical time with this arithmetic, and states that as an
  # identification, not as a theorem. No compared statement is a physical
  # claim, and no gravity claim is made.
  arxiv: ["math.CO", "math.NT", "math.DS", "physics.hist-ph"]
  msc2020: ["68R15", "11R06", "37B10", "00A79"]

sources:
  - title: "Algebraic integers whose conjugates lie in the unit circle"
    authors:
      - "Carl Ludwig Siegel"
    id: "Duke Mathematical Journal 11 (1944), 597-602"
    type: "article"
    location: "https://doi.org/10.1215/S0012-7094-44-01152-X"
    relationship: "independently-proves"
    note: >-
      Siegel proved that the real root ρ of x³ − x − 1 is the smallest
      Pisot number, in every degree. Compared statement 4
      (pisot_ge_plastic) is the restriction of that theorem to Pisot
      numbers of degree at most 3, proved here by a different route: a
      Pisot number equals the Mahler measure of its minimal polynomial
      (Time.Clock.mahler_eq_of_pisot), and the minimal Mahler measures in
      degrees 2 and 3 of registered entry PALOMAR-2026-08-31-000004 bound
      that measure below by the golden ratio and by ρ. The result is not
      new. The bound ρ ≤ θ of statement 1 is this statement applied to an
      eigenvalue.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Rauzy Fractal of the Smallest Substitution Associated with the Smallest Pisot Number"
    authors:
      - "Paul Mercat"
    id: "Experimental Mathematics 29 (2020), 163-182"
    type: "article"
    location: "https://doi.org/10.1080/10586458.2018.1446063"
    relationship: "independently-proves"
    note: >-
      Section 1 observes, without proof, that up to a permutation of the
      letters the Padovan substitution and its reversal are the only
      substitutions on three letters associated with the smallest Pisot
      number. The equality case of compared statements 1 and 2 (θ = ρ
      exactly for the Padovan rule and its mirror, after renaming) proves
      that observation here, independently. The statement takes θ to be
      any real eigenvalue of the incidence matrix, allows every alphabet
      size k ≤ 3 (the "minimal number of letters" of the abstract of
      Mercat's preprint, https://www.i2m.univ-amu.fr/perso/paul.mercat/Recherche/SmallestPisotSubstitution.pdf), and
      assumes no primitivity, unit or non-erasing property; in the
      equality case each of these is a consequence. The proof
      classifies the 3 × 3 natural matrices with characteristic polynomial
      x³ − x − 1 (statement 3) and then the substitutions with such a
      matrix.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Dynamical Invariants from Asymptotic Composants"
    authors:
      - "Franz Gähler"
    id: "arXiv:2602.18501"
    type: "article"
    location: "https://arxiv.org/abs/2602.18501"
    relationship: "background"
    note: >-
      Establishes computationally the reflection asymmetry of
      plastic-number substitution tiling spaces; the Padovan rule
      appears, up to letter renaming and reflection, as the class-7
      representative in Table 2. Compared statement 5 is a
      factor-language statement about the iterates of the Padovan rule
      and its mirror, proved by a different, enumeration-free method (the
      successor invariant: every a in a positive iterate is followed by
      b); no tiling-space statement is made.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Reversing and extended symmetries of shift spaces"
    authors:
      - "Michael Baake"
      - "John A. G. Roberts"
      - "Reem Yassawi"
    id: "Discrete and Continuous Dynamical Systems A 38 (2018), 835-866"
    type: "article"
    location: "https://doi.org/10.3934/dcds.2018036"
    relationship: "background"
    note: >-
      Published examples of substitution languages not closed under
      reversal (Example 2), and the distinction between language
      chirality and the existence of a reversor for the shift. Compared
      statement 5 is about factors of iterates only; no reversor
      statement is made.
    license: "unknown"
    author_endorsement: "not-contacted"

