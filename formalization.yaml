fidelity:
  divergences: >-
    (a) Statement 4 is Siegel's theorem restricted to degree at most 3,
    proved through the registered minimal Mahler measures of
    PALOMAR-2026-08-31-000004 (a Pisot number equals the Mahler measure
    of its minimal polynomial, Time.Clock.mahler_eq_of_pisot), not by
    Siegel's argument; the result is classical. (b) In statements 1, 2
    and 4 the plastic number enters hypothesis-style, as any real ρ with
    ρ³ = ρ + 1 (that equation has exactly one real solution:
    DefinitionAudit.plastic_exists_unique); "Pisot" is spelled
    in-statement through minpoly ℚ θ and its complex roots
    (DefinitionAudit.mem_aroots_minpoly, aroots_minpoly_nodup); in
    statement 1, algebraic integrality of θ is not a hypothesis, since θ
    is a root of the monic integer polynomial (inc σ).charpoly
    (DefinitionAudit.isIntegral_of_aeval_charpoly), and "θ is an
    eigenvalue" is spelled aeval θ (inc σ).charpoly = 0, equivalent to
    the existence of a nonzero real eigenvector
    (DefinitionAudit.aeval_charpoly_eq_zero_iff). (c) Renaming the letters
    is an equivalence e : Fin k ≃ Fin 3 applied letterwise, so the
    equality case forces k = 3; "the Padovan rule or its mirror" is the
    disjunction of the two letterwise conjugacies. (d) Statement 1 gives
    the bound and the equality case; that ρ is attained, as a Pisot
    eigenvalue of the Padovan matrix, is padovan_pisot_eigenvalue in
    Supplement.lean, proved and not compared. (e) Statement 5 is at the
    iterate-factor level: it quantifies over factors of the concrete words
    (sub s)^[n] [x] and (sub (mir s))^[n] [x], not over an abstract
    subshift or tiling space; its positive halves are single witnesses at
    the seed 0 and depth 5. (f) Four definitions appear on the compared
    surface (s, mir, inc, sub), each a one-line construction, identical in
    Challenge.lean and Solution.lean. (g) Module provenance is recorded
    in BUILD.txt and in related_formalizations; no copied module's
    statement was changed, and relative to the registered revisions the
    only proof change is the repair of one simp step in
    quartic_irred_zmod2, in Irreducibility and PdtIrreducible. (h) The physical
    reading in the README's Scope section is an identification, stated
    there as one; it is not a theorem and no compared statement asserts
    it.

