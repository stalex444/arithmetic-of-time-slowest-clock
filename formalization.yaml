  - id: "https://github.com/stalex444/pdt-lean (parent development; pinned reference revision: commit 34f7b0a8238c3260d73086d2a7e1f7d086f897d7)"
    relationship: "other"
    note: >-
      The public project this entry belongs to. This repository is a
